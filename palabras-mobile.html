<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palabras — pedir código · Juana Cabrera</title>
<link rel="icon" type="image/png" href="assets/brand/icon-dark-ink.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="assets/brand/icon-light-ink.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&amp;family=Courier+Prime:wght@400;700&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Juana Mano Suave";src:url("assets/fonts/JuanaManoSuaveLC-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Juana Mano Suave LC";src:url("assets/fonts/JuanaManoSuaveLC-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Juana Mano Fina Suave";src:url("assets/fonts/JuanaManoFinaSuave-Regular.woff2") format("woff2");font-display:swap}
body{margin:0}
input::placeholder{font-family:'Courier Prime',monospace;font-weight:400;color:#5b6f9c;opacity:1;letter-spacing:0;text-transform:none}
a{color:#ffffff}
.textura{background-image:url(assets/home/textura-azul.jpg);background-size:cover;background-position:center}
</style>
</head><body>
<div class="textura" style="min-height:100vh;font-family:'Instrument Sans',sans-serif;font-size:17px;line-height:1.5;color:#ffffff;overflow:hidden">
  <div style="min-height:100vh;box-sizing:border-box;background:rgba(33,84,170,.84);padding:14px 20px 32px;display:flex;flex-direction:column;gap:18px">
    <header style="display:flex;align-items:center;justify-content:space-between">
      <a href="home-mobile.html" aria-label="Volver a la home de Juana Cabrera" style="line-height:0"><img src="assets/home/logo-juana.png" alt="Juana Cabrera" style="height:44px;width:auto"></a>
    </header>
    <div style="display:flex;flex-direction:column;gap:26px;margin-top:10px">
      <div style="position:relative;width:100%;transform:rotate(-2deg)">
        <img src="assets/palabras/tapa-palabras.jpg" alt="Tapa del disco Palabras" style="display:block;width:100%;aspect-ratio:1;object-fit:cover;border:8px solid #ffffff;box-sizing:border-box;box-shadow:0 14px 26px rgba(0,0,0,.35)">
        <img src="assets/palabras/cinta.png" alt="" aria-hidden="true" style="position:absolute;right:-16px;top:-12px;width:70px;height:34px;object-fit:cover;opacity:.9;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(40deg)">
      </div>
      <h1 style="margin:22px 0 0;font-family:'Juana Mano Suave','Covered By Your Grace',cursive;font-weight:400;font-size:34px;line-height:1.1;text-transform:uppercase;letter-spacing:1px"><span style="display:block;text-transform:none;font-family:'Juana Mano Suave LC','Juana Mano Suave',cursive;font-feature-settings:'calt' 0;font-variant-ligatures:none">Cómo se hizo</span><span style="display:block">el primer disco</span></h1>
    </div>
    <p style="margin:0;color:#e9edf9;display:flex;align-items:flex-start;gap:10px"><img src="assets/home/estrella-blanca-a.webp" alt="" aria-hidden="true" style="width:22px;height:22px;object-fit:contain;flex:none;margin-top:2px"><span>Escribí el código que viene en tu postal para entrar.</span></p>
    <form onsubmit="event.preventDefault()" style="display:flex;flex-direction:column;gap:12px;background:#ffffff;color:#12306a;padding:22px 18px;margin-top:6px;position:relative;transform:rotate(-1deg)">
      <img src="assets/palabras/cinta.png" alt="" aria-hidden="true" style="position:absolute;left:26px;top:-16px;width:54px;height:30px;object-fit:cover;opacity:.9;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(-7deg)">
      <img src="assets/palabras/cinta.png" alt="" aria-hidden="true" style="position:absolute;right:26px;top:-16px;width:54px;height:30px;object-fit:cover;opacity:.9;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(6deg)">
      <label for="codigo" style="font-family:'Juana Mano Fina Suave','Juana Mano Suave',cursive;font-weight:400;font-size:26px;line-height:1.1;margin-bottom:-6px">Código</label>
      <input id="codigo" autocomplete="one-time-code" placeholder="Tu código" style="font:700 20px 'Courier Prime',monospace;letter-spacing:3px;text-transform:uppercase;padding:12px 14px;border:2px solid #2154aa;color:#12306a">
      <label for="email" style="font-family:'Juana Mano Fina Suave','Juana Mano Suave',cursive;font-weight:400;font-size:26px;line-height:1.1;margin-bottom:-6px">Tu email</label>
      <input id="email" type="email" autocomplete="email" placeholder="nombre@email.com" style="font:400 20px 'Courier Prime',monospace;padding:12px 14px;border:2px solid #2154aa;color:#12306a">
      <label for="novedades" style="display:flex;align-items:center;gap:12px;min-height:44px;font-family:'Juana Mano Suave LC','Juana Mano Suave',cursive;font-weight:400;font-size:22px;line-height:1.1;cursor:pointer"><input id="novedades" type="checkbox" checked="" style="flex:none;width:22px;height:22px;margin:0;accent-color:#2154aa"><span>Quiero recibir novedades de Juana</span></label>
      <button type="submit" style="min-height:54px;border:0;background:#2154aa;color:#ffffff;font:600 18px 'Instrument Sans',sans-serif;margin-top:2px">Entrar</button>
    </form>
  </div>
</div>
</body></html>
