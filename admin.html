<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Juana · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="bar">
  <div class="bar__brand"><span class="bar__logo">Juana</span><span class="bar__tag">Admin</span></div>
  <div class="bar__ro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    Solo lectura · los oyentes no reciben respuestas
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Mensajes</h1>
      <p class="head__sum" id="summary"></p>
    </div>
    <div class="head__tools">
      <button class="ghost" id="seed" hidden>Cargar mensajes de ejemplo</button>
    </div>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Filtrar por canción"></div>

  <div class="cols">
    <nav class="people" id="people" aria-label="Personas"></nav>
    <section class="feed" id="feed" aria-label="Mensajes"></section>
  </div>
</main>

<script src="messages.js"></script>
<script src="admin.js"></script>
</body>
</html>
